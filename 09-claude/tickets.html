<!DOCTYPE html>
<!--
    Ticket Review demo page.

    On every page load, 6 random ticket titles are picked from a fixed list
    and rendered as ticket cards. Each card has three buttons — Approve,
    Deny, Doubt — and clicking one colors the card (green / red / yellow)
    by swapping a CSS class on it. Everything runs in the browser; there is
    no server and nothing is saved between reloads.
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Review</title>
    <style>
        /* Base look of every ticket card */
        .ticket {
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin: 12px;
            background-color: white;
        }

        /* Status colors — one of these classes is added when a button is clicked */
        .ticket.approve {
            background-color: lightgreen;
        }

        .ticket.deny {
            background-color: lightcoral;
        }

        .ticket.doubt {
            background-color: khaki;
        }
    </style>
</head>

<body>
    <div id="tickets"></div>

    <script>
        // Pool of possible ticket titles — 6 are picked at random each load
        const TITLES = [
            "Session timeout too aggressive",
            "Add pagination to search results",
            "Cart total miscalculates with coupons",
            "Support dark mode in email templates",
            "Duplicate notifications on retry",
            "Add bulk delete for admin panel",
            "Video upload fails over 50MB",
            "Improve error message on invalid input",
            "Add keyboard shortcuts for power users",
            "Memory leak in websocket connection"
        ]

        // Shuffle the titles and return the first `count` of them
        function pickRandomTitles(count) {
            const shuffled = [...TITLES].sort(() => Math.random() - 0.5)
            return shuffled.slice(0, count)
        }

        // Set a ticket's status: clear any previous status class, then add the new one
        function setStatus(ticket, status) {
            ticket.classList.remove("approve", "deny", "doubt")
            ticket.classList.add(status)
        }

        // Build one ticket card: a heading plus the three status buttons
        function createTicket(number, title) {
            const ticket = document.createElement("div")
            ticket.className = "ticket"

            const heading = document.createElement("h3")
            heading.textContent = `Ticket #${number}: ${title}`
            ticket.appendChild(heading)

            const approveButton = document.createElement("button")
            approveButton.textContent = "Approve"
            approveButton.addEventListener("click", () => setStatus(ticket, "approve"))
            ticket.appendChild(approveButton)

            const denyButton = document.createElement("button")
            denyButton.textContent = "Deny"
            denyButton.addEventListener("click", () => setStatus(ticket, "deny"))
            ticket.appendChild(denyButton)

            const doubtButton = document.createElement("button")
            doubtButton.textContent = "Doubt"
            doubtButton.addEventListener("click", () => setStatus(ticket, "doubt"))
            ticket.appendChild(doubtButton)

            return ticket
        }

        // Entry point: pick 6 random titles and render a ticket card for each
        const container = document.getElementById("tickets")
        const chosenTitles = pickRandomTitles(6)
        chosenTitles.forEach((title, index) => {
            container.appendChild(createTicket(index + 1, title))
        })
    </script>
</body>

</html>
