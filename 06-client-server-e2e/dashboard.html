<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Political Houses Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    header p {
      color: #9ca3af;
      margin-top: 8px;
      font-size: 1rem;
    }

    #load-btn {
      display: block;
      margin: 0 auto 48px;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(90deg, #7c3aed, #2563eb);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 24px rgba(124, 58, 237, 0.4);
    }

    #load-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    #load-btn:active { transform: translateY(0); }
    #load-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    #status {
      text-align: center;
      color: #a78bfa;
      font-size: 0.9rem;
      margin-bottom: 32px;
      min-height: 22px;
      transition: opacity 0.3s;
    }

    #houses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 28px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── House Card ── */
    .house-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: box-shadow 0.3s, border-color 0.3s;
    }

    .house-card:hover {
      box-shadow: 0 12px 48px rgba(124, 58, 237, 0.25);
      border-color: rgba(167, 139, 250, 0.35);
    }

    .house-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 26px;
      cursor: pointer;
      user-select: none;
      gap: 12px;
    }

    .house-header:hover .house-title { color: #a78bfa; }

    .house-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .house-title {
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: capitalize;
      flex: 1;
      transition: color 0.2s;
      color: #f3f4f6;
    }

    .house-count {
      font-size: 0.8rem;
      color: #9ca3af;
      background: rgba(255,255,255,0.07);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .chevron {
      font-size: 1rem;
      color: #9ca3af;
      transition: transform 0.3s;
    }

    .house-card.open .chevron { transform: rotate(180deg); }

    /* ── Politicians List ── */
    .politicians-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .house-card.open .politicians-list {
      max-height: 1000px;
    }

    .politicians-inner {
      padding: 0 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 0 26px 16px;
    }

    /* ── Politician Row ── */
    .politician {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: background 0.2s, border-color 0.2s;
    }

    .politician:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(167, 139, 250, 0.2);
    }

    .politician-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #fff;
      flex-shrink: 0;
    }

    .politician-info { flex: 1; min-width: 0; }

    .politician-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #f3f4f6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .politician-email {
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Role Badge ── */
    .role-wrapper { position: relative; }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: opacity 0.2s, transform 0.15s;
      text-transform: capitalize;
    }

    .role-badge:hover { opacity: 0.85; transform: scale(1.04); }

    .role-badge[data-role-id="1"] { background: rgba(239,68,68,0.18); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
    .role-badge[data-role-id="2"] { background: rgba(59,130,246,0.18); color: #93c5fd; border-color: rgba(59,130,246,0.3); }
    .role-badge[data-role-id="3"] { background: rgba(16,185,129,0.18); color: #6ee7b7; border-color: rgba(16,185,129,0.3); }
    .role-badge[data-role-id="4"] { background: rgba(245,158,11,0.18); color: #fcd34d; border-color: rgba(245,158,11,0.3); }

    /* ── Credentials Popover ── */
    .credentials-popover {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      background: #1e1b4b;
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 14px;
      padding: 14px 16px;
      min-width: 180px;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: pop-in 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop-in {
      from { opacity: 0; transform: scale(0.88) translateY(6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .credentials-popover h4 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a78bfa;
      margin-bottom: 10px;
    }

    .credential-tag {
      display: inline-block;
      background: rgba(167, 139, 250, 0.15);
      border: 1px solid rgba(167, 139, 250, 0.3);
      color: #c4b5fd;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.78rem;
      margin: 3px 3px 0 0;
    }

    /* ── Loading spinner ── */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(167, 139, 250, 0.3);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      text-align: center;
      color: #f87171;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      padding: 14px 20px;
      max-width: 500px;
      margin: 0 auto;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏛 Political Houses</h1>
    <p>Explore houses, politicians, and their credentials</p>
  </header>

  <button id="load-btn">Load Data</button>
  <div id="status"></div>
  <div id="error-msg"></div>
  <div id="houses-grid"></div>

  <script src="dashboard.js"></script>
</body>
</html>
